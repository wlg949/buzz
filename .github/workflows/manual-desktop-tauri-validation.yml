name: Manual Desktop Tauri Validation

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact commit SHA to validate
        required: true
      run_linux:
        description: Run the Linux validation job
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  desktop-tauri:
    name: Desktop Tauri
    if: inputs.run_linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.commit }}
      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.commit }}
        run: |
          actual=$(git rev-parse HEAD)
          test "$actual" = "$EXPECTED_COMMIT"
          echo "Validated commit: $actual"
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: desktop/src-tauri
      - name: Install Tauri dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget
      - name: Format check
        run: just desktop-tauri-fmt-check
      - name: Clippy
        run: just desktop-tauri-clippy
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      - name: Check
        run: just desktop-tauri-check
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      - name: Test
        run: just desktop-tauri-test
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      - name: Compiled-flag verification
        run: just desktop-tauri-test-compiled-flags
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"

  windows-tauri:
    name: Windows Tauri (MSVC)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.commit }}
      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.commit }}
        run: |
          actual=$(git rev-parse HEAD)
          test "$actual" = "$EXPECTED_COMMIT"
          echo "Validated commit: $actual"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: desktop/src-tauri
          key: windows-msvc
      - name: Create sidecar placeholders
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/binaries
          for bin in buzz-acp buzz-agent buzz-dev-mcp git-credential-nostr buzz; do
            touch "desktop/src-tauri/binaries/${bin}-${TARGET}.exe"
          done
      - name: Clippy
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets --target $env:TARGET -- -D warnings
      - name: Check
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml --all-targets --target $env:TARGET
      - name: Test
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --target $env:TARGET
